<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>more</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-grid>
    <ion-row class="ion-align-items-center">
      <ion-col>
        <ion-avatar>
          <ion-img src="/assets/imagenes/anime01 (1).jpg"/>
        </ion-avatar>
      </ion-col>
      <ion-chip routerLink="/inicio" style="justify-content: center">
        <ion-avatar>
          <ion-img src="/assets/imagenes/anime01 (1).jpg"/>
        </ion-avatar>
        <ion-label>GO HOME</ion-label>
      </ion-chip>
      <ion-col>
        <ion-avatar>
          <ion-img src="/assets/imagenes/anime01 (1).jpg"/>
        </ion-avatar>
      </ion-col>
    </ion-row>
  </ion-grid>
  <br>
  <ion-grid>
    <ion-row class="ion-align-items-center ion-justify-content-center">
      <ion-col>
      <ion-chip>
        <ion-avatar>
          <ion-img src=" /assets/imagenes/anime01 (1).jpg"/>
        </ion-avatar>
        <ion-label id="alert-true">
          True
        </ion-label>
        <ion-alert trigger="alert-true"
                   header="Alert True"
                   message="True or False?"
                   [buttons]="radioButtonsTrue"
                   [inputs]="radioInputs">
        </ion-alert>
      </ion-chip>
      </ion-col>
      <ion-col>
      <ion-chip>
        <ion-avatar>
          <ion-img src=" /assets/imagenes/anime01 (1).jpg"/>
        </ion-avatar>
        <ion-label id="alert-falso">
          False
        </ion-label>
        <ion-alert trigger="alert-falso"
        header="Alert Falso"
        message="True or False?"
        [buttons]="radioButtonsFalse"
        [inputs]="radioInputs">
        </ion-alert>
      </ion-chip>
      </ion-col>
    </ion-row>
  </ion-grid>


</ion-content>
